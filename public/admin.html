<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4realium - Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23E91E8C'/><path d='M30 52 L44 66 L70 36' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 100 100" width="32" height="32">
            <circle cx="50" cy="50" r="45" fill="#E91E8C"/>
            <path d="M30 52 L44 66 L70 36" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span>4realium</span>
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
      </div>
    </div>
  </nav>

  <div id="login-screen" class="login-box">
    <h1>Admin Access</h1>
    <p>Enter the admin password to continue</p>
    <input type="password" id="admin-password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <div id="login-error" class="login-error">Wrong password</div>
    <button class="btn-submit" onclick="login()">Log In</button>
  </div>

  <div id="admin-panel" class="admin-page" style="display:none">
    <h1 id="form-title">Upload Script</h1>
    <p class="subtitle" id="form-subtitle">Add scripts to the hub</p>

    <form id="upload-form">
      <div class="form-group">
        <label>Script Name</label>
        <input type="text" id="script-name" placeholder="e.g. Blox Fruits Script" required>
        <div class="hint">URL will be: 4realium.xyz/script/<strong id="slug-preview">your-script</strong></div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <input type="text" id="script-desc" placeholder="What does this script do?">
      </div>

      <div class="form-group">
        <label>Script Code</label>
        <textarea id="script-code" placeholder="-- Paste your Lua script here" required></textarea>
      </div>

      <div class="form-group">
        <label>Game Place ID</label>
        <input type="text" id="script-gameid" placeholder="e.g. 155615604 (comma separate for multiple)">
        <div class="hint">Used by the loader to auto-detect which script to run</div>
      </div>

      <div class="form-group">
        <label>Key System</label>
        <select id="script-key-select" style="width:100%;padding:12px 16px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:8px">
          <option value="">None</option>
          <option value="4realium">4realium Key System</option>
          <option value="custom">Custom Key System</option>
        </select>
        <textarea id="script-keycode" placeholder="Paste custom key system code here" style="min-height:120px;display:none"></textarea>
        <div class="hint">4realium key = loads from your GitHub repo</div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Upload Script</button>
      <button type="button" class="btn-submit" id="cancel-btn" style="display:none;background:var(--bg-elevated);border:1px solid var(--border);margin-top:8px" onclick="cancelEdit()">Cancel Edit</button>
    </form>

    <div class="manage-section" id="manage">
      <h2>Manage Scripts</h2>
      <div id="manage-list"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let ADMIN_KEY = '';
    let editingId = null;

    function login() {
      const pw = document.getElementById('admin-password').value;
      if (!pw) return;
      ADMIN_KEY = btoa(pw);

      fetch('/api/auth', { method: 'POST', headers: { 'Authorization': 'Basic ' + ADMIN_KEY } })
        .then(r => { if (r.ok) { document.getElementById('login-screen').style.display = 'none'; document.getElementById('admin-panel').style.display = 'block'; loadManageList(); } else { document.getElementById('login-error').style.display = 'block'; } })
        .catch(() => { document.getElementById('login-error').style.display = 'block'; });
    }

    const nameInput = document.getElementById('script-name');
    const slugPreview = document.getElementById('slug-preview');
    const form = document.getElementById('upload-form');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const manageList = document.getElementById('manage-list');

    nameInput.addEventListener('input', () => {
      if (!editingId) {
        const slug = nameInput.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        slugPreview.textContent = slug || 'your-script';
      }
    });

    const keySelect = document.getElementById('script-key-select');
    const keyTextarea = document.getElementById('script-keycode');
    keySelect.addEventListener('change', () => {
      keyTextarea.style.display = keySelect.value === 'custom' ? 'block' : 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = editingId ? 'Saving...' : 'Uploading...';

      let keyCode = '';
      if (keySelect.value === '4realium') {
        keyCode = 'loadstring(game:HttpGet("https://raw.githubusercontent.com/Peliy11/4realium/refs/heads/main/key.lua"))()';
      } else if (keySelect.value === 'custom') {
        keyCode = document.getElementById('script-keycode').value;
      }

      const body = {
        name: document.getElementById('script-name').value,
        description: document.getElementById('script-desc').value,
        code: document.getElementById('script-code').value,
        gameId: document.getElementById('script-gameid').value,
        keyCode: keyCode
      };

      try {
        const url = editingId ? '/api/scripts/' + editingId : '/api/scripts';
        const method = editingId ? 'PUT' : 'POST';
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + ADMIN_KEY },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (res.ok) {
          showToast(editingId ? 'Script updated!' : 'Script uploaded!');
          cancelEdit();
          form.reset();
          slugPreview.textContent = 'your-script';
          loadManageList();
        } else {
          showToast(data.error || 'Failed');
        }
      } catch (err) {
        showToast('Network error');
      }

      submitBtn.disabled = false;
      submitBtn.textContent = editingId ? 'Save Changes' : 'Upload Script';
    });

    function cancelEdit() {
      editingId = null;
      document.getElementById('form-title').textContent = 'Upload Script';
      document.getElementById('form-subtitle').textContent = 'Add scripts to the hub';
      submitBtn.textContent = 'Upload Script';
      cancelBtn.style.display = 'none';
      slugPreview.textContent = 'your-script';
    }

    async function editScript(id) {
      try {
        const res = await fetch('/api/scripts/' + id, { headers: { 'Authorization': 'Basic ' + ADMIN_KEY } });
        const s = await res.json();

        editingId = id;
        document.getElementById('form-title').textContent = 'Edit Script';
        document.getElementById('form-subtitle').textContent = 'Update ' + s.name;
        submitBtn.textContent = 'Save Changes';
        cancelBtn.style.display = 'block';

        document.getElementById('script-name').value = s.name || '';
        document.getElementById('script-desc').value = s.description || '';
        document.getElementById('script-code').value = s.code || '';
        document.getElementById('script-gameid').value = s.gameId || '';

        if (s.keyCode && s.keyCode.includes('github.com/Peliy11')) {
          keySelect.value = '4realium';
        } else if (s.keyCode) {
          keySelect.value = 'custom';
          keyTextarea.value = s.keyCode;
          keyTextarea.style.display = 'block';
        } else {
          keySelect.value = '';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        showToast('Failed to load script');
      }
    }

    async function loadManageList() {
      try {
        const res = await fetch('/api/scripts', { headers: { 'Authorization': 'Basic ' + ADMIN_KEY } });
        const scripts = await res.json();

        if (scripts.length === 0) {
          manageList.innerHTML = '<p style="color:var(--text-dim);font-size:14px;">No scripts uploaded yet.</p>';
          return;
        }

        manageList.innerHTML = scripts.map(s => `
          <div class="manage-item">
            <div class="manage-item-info">
              <h4>${escapeHtml(s.name)}</h4>
              <p>${s.slug} - ${s.loadCount || 0} loads${s.gameId ? ' - Game: ' + s.gameId : ''}</p>
            </div>
            <div class="manage-item-actions">
              <button class="btn-small" onclick="editScript('${s.id}')">Edit</button>
              <button class="btn-danger" onclick="deleteScript('${s.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        manageList.innerHTML = '<p style="color:var(--text-dim)">Failed to load</p>';
      }
    }

    async function deleteScript(id) {
      if (!confirm('Delete this script?')) return;
      await fetch('/api/scripts/' + id, { method: 'DELETE', headers: { 'Authorization': 'Basic ' + ADMIN_KEY } });
      showToast('Script deleted');
      loadManageList();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
